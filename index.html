<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Markane Cup</title>

<link rel="stylesheet" href="style.css">

</head>


<body>

<div class="container">

<h1>🏆 MARKANE CUP 🏆</h1>

<div id="menu">

<h2>Select Your Team</h2>

<div id="teams"></div>

<button id="startButton">
Start Tournament
</button>

</div>



<div id="tournament" class="hidden">

<h2>Tournament Bracket</h2>

<div id="bracket"></div>

</div>



<div id="match" class="hidden">

<h2 id="matchTitle"></h2>

<div class="scoreboard">

<div id="teamA"></div>

<div id="score">
0 - 0
</div>

<div id="teamB"></div>

</div>


<h1 id="clock">
0'
</h1>


<div id="events"></div>


<button id="simulate">
Simulate Match
</button>


</div>



<div id="winner" class="hidden">

<h1>🏆 CHAMPIONS 🏆</h1>

<h2 id="champion"></h2>

</div>


</div>


<script src="script.js"></script>

</body>

</html>
